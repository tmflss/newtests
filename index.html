let correct=0,wrong=0,totalQ=0;
const side=document.getElementById('side');
const main=document.getElementById('main');
const mob=document.getElementById('mobTabs');

let h='<h3>Темы</h3>';
let mh='';
T.forEach((t,ti)=>{
  h+='<div class="st" id="st'+ti+'" onclick="showTopic('+ti+')"><span>'+t.name+'</span><span class="cnt">'+t.questions.length+'</span></div>';
  mh+='<button id="mt'+ti+'" onclick="showTopic('+ti+')">'+t.name.split(' ')[0]+'</button>';
});
side.innerHTML=h;
mob.innerHTML=mh;

T.forEach((t,ti)=>{
  const sec=document.createElement('div');
  sec.id='topic'+ti;
  sec.style.display='none';
  let th='<div class="topic-title">'+t.name+' ('+t.questions.length+' вопросов)</div>';
  t.questions.forEach(q=>{
    totalQ++;
    const isMulti=q.o.filter(o=>o.c).length>1;
    const d=document.createElement('div');
    d.className='q';d.id='q'+q.n;
    let qh='<div class="qh"><span class="qn">'+q.n+'</span><div><div class="qt">'+q.q+'</div>';
    qh+='<div class="qm">'+(isMulti?'Выберите несколько ответов':'Выберите один ответ')+'</div></div></div>';
    q.o.forEach((o,i)=>{
      const tp=isMulti?'checkbox':'radio';
      qh+='<div class="op" id="o'+q.n+'_'+i+'" onclick="clk('+q.n+','+i+')">';
      qh+='<input type="'+tp+'" name="q'+q.n+'" id="i'+q.n+'_'+i+'"><span class="ot">'+o.t+'</span></div>';
    });
    qh+='<button class="chkbtn" id="b'+q.n+'" onclick="checkQ('+q.n+')">Проверить ответ</button>';
    qh+='<div class="msg" id="m'+q.n+'"></div>';
    qh+='<div class="rvl" id="r'+q.n+'"></div>';
    d.innerHTML=qh;sec.appendChild(d);
  });
  main.appendChild(sec);
});

showTopic(0);

function showTopic(ti){
  document.querySelectorAll('.main > div').forEach(d=>d.style.display='none');
  document.getElementById('topic'+ti).style.display='block';
  document.querySelectorAll('.st').forEach(s=>s.classList.remove('active'));
  document.getElementById('st'+ti).classList.add('active');
  document.querySelectorAll('.mob-tabs button').forEach(b=>b.classList.remove('active'));
  document.getElementById('mt'+ti).classList.add('active');
  scrollTo({top:0,behavior:'smooth'});
}

function clk(n,oi){
  const el=document.getElementById('o'+n+'_'+oi);
  const inp=document.getElementById('i'+n+'_'+oi);
  if(inp.disabled)return;
  inp.checked=!inp.checked;
  el.classList.toggle('sel',inp.checked);
}

function checkQ(n){
  let q=null;
  for(const t of T)for(const qq of t.questions)if(qq.n===n){q=qq;break;}
  if(!q)return;
  let allRight=true;
  q.o.forEach((o,i)=>{
    const el=document.getElementById('o'+n+'_'+i);
    const inp=document.getElementById('i'+n+'_'+i);
    el.classList.remove('sel','cg','wr','mk');
    if(inp.checked&&o.c)el.classList.add('cg');
    else if(inp.checked&&!o.c){el.classList.add('wr');allRight=false;}
    else if(!inp.checked&&o.c){el.classList.add('mk');allRight=false;}
    inp.disabled=true;el.onclick=null;
  });
  document.getElementById('b'+n).disabled=true;
  const m=document.getElementById('m'+n);
  if(allRight){m.className='msg v';m.textContent='Правильно! ✓';document.getElementById('q'+n).classList.add('ok');correct++;}
  else{m.className='msg x';m.textContent='Неправильно ✗';document.getElementById('q'+n).classList.add('no');wrong++;}
  const r=document.getElementById('r'+n);
  r.innerHTML='<strong>Правильные ответы:</strong> '+q.o.filter(o=>o.c).map(o=>o.t).join('; ');
  r.className='rvl v';
  updStat();
}

function updStat(){
  document.getElementById('sC').textContent='✓ '+correct;
  document.getElementById('sW').textContent='✗ '+wrong;
  document.getElementById('sR').textContent='Осталось: '+(totalQ-correct-wrong);
}

function resetAll(){
  correct=0;wrong=0;
  T.forEach(t=>t.questions.forEach(q=>{
    q.o.forEach((o,i)=>{
      const el=document.getElementById('o'+q.n+'_'+i);
      const inp=document.getElementById('i'+q.n+'_'+i);
      el.className='op';inp.checked=false;inp.disabled=false;
      el.onclick=function(){clk(q.n,i);};
    });
    document.getElementById('b'+q.n).disabled=false;
    document.getElementById('m'+q.n).className='msg';
    document.getElementById('r'+q.n).className='rvl';
    document.getElementById('q'+q.n).className='q';
  }));
  updStat();
}

function showAll(){
  T.forEach(t=>t.questions.forEach(q=>{
    q.o.forEach((o,i)=>{
      const el=document.getElementById('o'+q.n+'_'+i);
      const inp=document.getElementById('i'+q.n+'_'+i);
      el.className='op';inp.checked=false;inp.disabled=true;el.onclick=null;
      el.classList.add(o.c?'sc':'sw');
    });
    document.getElementById('b'+q.n).disabled=true;
    document.getElementById('m'+q.n).className='msg';
    const r=document.getElementById('r'+q.n);
    r.innerHTML='<strong>Правильные ответы:</strong> '+q.o.filter(o=>o.c).map(o=>o.t).join('; ');
    r.className='rvl v';
    document.getElementById('q'+q.n).className='q';
  }));
  document.getElementById('sC').textContent='✓ —';
  document.getElementById('sW').textContent='✗ —';
  document.getElementById('sR').textContent='Показаны все ответы';
}

</script>
